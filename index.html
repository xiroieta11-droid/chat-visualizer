<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor de xat de WhatsApp</title>
<style>
:root{--bg:#f4f1ec;--sf:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#1f7a5a;--bd:#ddd8cf;--hl:#ffe58a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121512;--sf:#1c211d;--tx:#ecebe6;--mu:#9a9a92;--ac:#4cc59a;--bd:#2c332e;--hl:#6b5a10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121512;--sf:#1c211d;--tx:#ecebe6;--mu:#9a9a92;--ac:#4cc59a;--bd:#2c332e;--hl:#6b5a10;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#drop{margin:auto;max-width:520px;width:calc(100% - 32px);text-align:center;border:2px dashed var(--bd);border-radius:16px;padding:40px 20px;background:var(--sf)}
#drop.over{border-color:var(--ac)}
#drop h1{font-size:22px;margin:0 0 8px}#drop p{color:var(--mu);margin:6px 0}
#app{display:none;flex:1;min-height:0;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--sf);border-bottom:1px solid var(--bd);align-items:center}
#bar input[type=search]{flex:1;min-width:120px}
#info{color:var(--mu);font-size:12px;padding:4px 10px}
#list{flex:1;overflow-y:auto;padding:8px 10px;max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}
.day{text-align:center;margin:14px 0 6px}.day span{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:2px 10px;font-size:12px;color:var(--mu)}
.snd{font-size:12px;color:var(--ac);font-weight:600;margin:8px 0 2px}
.b{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;margin:2px 0;max-width:92%;width:fit-content;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.b.sys{margin:6px auto;color:var(--mu);font-size:12px;text-align:center}
.b.flash{outline:2px solid var(--ac)}
.b time{display:block;font-size:11px;color:var(--mu);text-align:right}
.b img,.b video{max-width:100%;max-height:360px;border-radius:8px;display:block;margin-bottom:4px}
.b audio{display:block;width:260px;min-width:200px;max-width:100%}
mark{background:var(--hl);color:inherit;border-radius:3px}
.ph{min-height:60px;background:var(--bg);border-radius:8px;color:var(--mu);font-size:12px;display:flex;align-items:center;justify-content:center}
#gal{display:none;flex:1;overflow-y:auto;padding:8px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;align-content:start}
#gal .g{aspect-ratio:1;background:var(--sf);border:1px solid var(--bd);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mu);padding:4px;text-align:center;word-break:break-all}
#gal img,#gal video{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="drop">
  <h1>💬 Visor de xat de WhatsApp</h1>
  <p>Arrossega aquí l’arxiu <b>.zip</b> exportat (amb multimèdia) o tria’l.</p>
  <p><button id="pick">Tria el .zip</button></p>
  <p style="font-size:12px">Tot s’executa al teu navegador: res no s’envia enlloc ni es desa. En tancar la pestanya, desapareix.</p>
  <p style="font-size:12px">Si el zip té molts GB: descomprimeix-lo i <a href="#" id="dirl">tria la carpeta</a>.</p>
  <p id="st" style="color:var(--ac)"></p>
  <input id="fz" type="file" accept=".zip" hidden><input id="fd" type="file" webkitdirectory multiple hidden>
</div>
<div id="app">
  <div id="bar">
    <input id="q" type="search" placeholder="Cerca (Intro = següent)">
    <button id="pv">↑</button><button id="nx">↓</button>
    <input id="dt" type="date" title="Salta a una data">
    <select id="ft"><option value="all">Tot</option><option value="img">Fotos</option><option value="vid">Vídeos</option><option value="aud">Àudios</option><option value="doc">Documents</option></select>
    <button id="gb">Galeria</button>
    <button id="nw" title="Carrega un altre xat">Un altre xat</button><button id="th" title="Tema">◐</button>
  </div>
  <div id="info"></div>
  <div id="list"></div>
  <div id="gal"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const EXT={img:'jpg jpeg png gif webp',vid:'mp4 mov 3gp webm',aud:'opus ogg m4a mp3 aac amr'};
let msgs=[],files=new Map(),view=[],win=[0,0],qs='',qIdx=[],qPos=-1,gal=false,busy=false,urls=new Map();
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const kind=n=>{const e=n.split('.').pop().toLowerCase();for(const k in EXT)if(EXT[k].split(' ').includes(e))return k;return 'doc'};
const blobOf=e=>e.async?e.async('blob'):Promise.resolve(e);
const textOf=e=>e.async?e.async('string'):e.text();
const lock=(v)=>{$('#st').textContent=v};

/* ---------- càrrega ---------- */
async function fromZip(f){
  lock('Llegint el zip…');
  try{
    const z=await JSZip.loadAsync(f);
    const m=new Map();
    z.forEach((p,e)=>{if(!e.dir&&!p.includes('__MACOSX'))m.set(p.split('/').pop(),e)});
    start(m);
  }catch(err){lock('No s’ha pogut llegir el zip: '+err.message+'. Prova amb la carpeta descomprimida.')}
}
function fromDir(list){
  const m=new Map();for(const f of list)m.set(f.name,f);start(m);
}
async function start(m){
  files=m;
  const txts=[...m.keys()].filter(n=>/\.txt$/i.test(n));
  const name=txts.find(n=>/whatsapp|chat|xat/i.test(n))||txts[0];
  if(!name){lock('No he trobat cap .txt dins l’arxiu.');return}
  lock('Analitzant missatges…');
  parse(await textOf(m.get(name)));
  if(!msgs.length){lock('No he reconegut cap missatge al .txt.');return}
  $('#drop').style.display='none';$('#app').style.display='flex';
  setView();jump(view.length-1,true);
}

/* ---------- parser ---------- */
const RE=/^\u200e?\[?(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4}),?\s+(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?\s?([AaPp]\.?\s?[Mm]\.?)?\]?\s?-?\s?([\s\S]*)$/;
function parse(txt){
  const raw=[];
  for(let l of txt.replace(/[\u202f\u00a0]/g,' ').split(/\r?\n/)){
    const m=RE.exec(l);
    if(m)raw.push({n:m.slice(1,8),t:m[8]});
    else if(raw.length)raw[raw.length-1].t+='\n'+l.replace(/\u200e/g,'');
  }
  const md=!raw.some(r=>+r.n[0]>12)&&raw.some(r=>+r.n[1]>12);
  msgs=raw.map(r=>{
    let [a,b,y,h,mi,s,ap]=r.n;a=+a;b=+b;y=+y;h=+h;
    if(y<100)y+=2000;
    if(ap){const pm=/p/i.test(ap);h=h%12+(pm?12:0)}
    const [d,mo]=md?[b,a]:[a,b];
    const ts=new Date(y,mo-1,d,h,+mi,+(s||0));
    let t=r.t.replace(/\u200e/g,''),snd='';
    const i=t.indexOf(': ');
    if(i>0&&i<60&&!t.slice(0,i).includes('\n')){snd=t.slice(0,i);t=t.slice(i+2)}
    let f=null,cap=t;
    const tag=/<(?:attached|adjunt|adjunto)\s*:\s*(.+?)>/i.exec(t);
    if(tag&&files.has(tag[1].trim())){f=tag[1].trim();cap=t.replace(tag[0],'').trim()}
    else{const first=t.split('\n')[0].trim(),c=first.split(/ \((?=[^()]*\)$)/)[0].trim();
      if(files.has(c)){f=c;cap=t.split('\n').slice(1).join('\n').trim()}}
    return {ts,snd,t:cap,f,k:f?kind(f):''};
  });
}

/* ---------- vista ---------- */
function setView(){
  const ft=$('#ft').value;
  view=[];msgs.forEach((m,i)=>{if(ft==='all'||m.k===ft)view.push(i)});
  doSearch(false);
  $('#info').textContent=view.length.toLocaleString('ca')+' missatges · '+
    (msgs[0].ts.toLocaleDateString('ca')+' – '+msgs[msgs.length-1].ts.toLocaleDateString('ca'))+
    ' · '+msgs.filter(m=>m.f).length.toLocaleString('ca')+' adjunts';
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadMedia(e.target)}}),{rootMargin:'400px'});
async function url(f){
  if(!urls.has(f))urls.set(f,blobOf(files.get(f)).then(b=>URL.createObjectURL(b)));
  return urls.get(f);
}
async function loadMedia(el){
  const f=el.dataset.f,k=el.dataset.k;
  try{
    const u=await url(f);
    if(k==='img'||k==='vid'||k==='aud'){
      const n=document.createElement(k==='img'?'img':k==='vid'?'video':'audio');
      n.src=u;if(k!=='img')n.controls=true,n.preload='metadata';else n.loading='lazy';
      if(el.classList.contains('gt'))n.controls=false;
      if(k==='aud')n.onerror=()=>n.replaceWith(docLink(f));
      el.replaceWith(n);
    }
  }catch(e){el.textContent='No s’ha pogut carregar '+f}
}
function docLink(f){
  const a=document.createElement('a');a.textContent='📎 '+f;a.href='#';
  a.onclick=async ev=>{ev.preventDefault();const u=await url(f);const d=document.createElement('a');d.href=u;d.download=f;d.click()};
  return a;
}
const dayKey=d=>d.toDateString();
function bubble(pos,prev){
  const m=msgs[view[pos]],frag=document.createDocumentFragment();
  if(!prev||dayKey(prev.ts)!==dayKey(m.ts)){
    const d=document.createElement('div');d.className='day';
    d.innerHTML='<span>'+esc(m.ts.toLocaleDateString('ca',{weekday:'short',day:'numeric',month:'long',year:'numeric'}))+'</span>';
    frag.append(d);
  }
  if(m.snd&&(!prev||prev.snd!==m.snd||dayKey(prev.ts)!==dayKey(m.ts))){
    const s=document.createElement('div');s.className='snd';s.textContent=m.snd;frag.append(s);
  }
  const b=document.createElement('div');b.className='b'+(m.snd?'':' sys');b.dataset.p=pos;
  if(m.f){
    if(m.k==='doc')b.append(docLink(m.f));
    else{const p=document.createElement('div');p.className='ph';p.dataset.f=m.f;p.dataset.k=m.k;p.textContent=m.f;b.append(p);io.observe(p)}
  }
  if(m.t){
    const sp=document.createElement('span');let h=esc(m.t);
    if(qs){const r=new RegExp(esc(qs).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');h=h.replace(r,x=>'<mark>'+x+'</mark>')}
    sp.innerHTML=h;b.append(sp);
  }
  const t=document.createElement('time');t.textContent=m.ts.toLocaleTimeString('ca',{hour:'2-digit',minute:'2-digit'});b.append(t);
  frag.append(b);return frag;
}
function render(){
  const L=$('#list');L.textContent='';
  const top=document.createElement('div');top.id='t';top.style.height='1px';L.append(top);
  let prev=null;
  for(let p=win[0];p<win[1];p++){L.append(bubble(p,prev));prev=msgs[view[p]]}
  const bt=document.createElement('div');bt.id='bt';bt.style.height='1px';L.append(bt);
  sio.observe(top);sio.observe(bt);
}
const sio=new IntersectionObserver(es=>{
  if(busy)return;
  for(const e of es){if(!e.isIntersecting)continue;
    const L=$('#list');
    if(e.target.id==='t'&&win[0]>0){
      busy=true;const first=L.querySelector('.b'),p0=first&&first.dataset.p,off=first?first.offsetTop-L.scrollTop:0;
      win[0]=Math.max(0,win[0]-150);if(win[1]-win[0]>600)win[1]=win[0]+600;render();
      const el=L.querySelector('.b[data-p="'+p0+'"]');if(el)L.scrollTop=el.offsetTop-off;
      setTimeout(()=>busy=false,150);
    }else if(e.target.id==='bt'&&win[1]<view.length){
      busy=true;const last=[...L.querySelectorAll('.b')].pop(),p0=last&&last.dataset.p,off=last?last.offsetTop-L.scrollTop:0;
      win[1]=Math.min(view.length,win[1]+150);if(win[1]-win[0]>600)win[0]=win[1]-600;render();
      const el=L.querySelector('.b[data-p="'+p0+'"]');if(el)L.scrollTop=el.offsetTop-off;
      setTimeout(()=>busy=false,150);
    }
  }
},{root:$('#list')});
function jump(pos,end){
  if(pos<0||pos>=view.length)return;
  busy=true;
  win=[Math.max(0,pos-120),Math.min(view.length,pos+200)];render();
  const el=$('#list').querySelector('.b[data-p="'+pos+'"]');
  if(el){el.scrollIntoView({block:end?'end':'center'});if(!end){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1800)}}
  setTimeout(()=>busy=false,200);
}

/* ---------- cerca, dates, filtres, galeria ---------- */
function doSearch(go=true){
  qs=$('#q').value.trim();qIdx=[];qPos=-1;
  if(qs){const l=qs.toLowerCase();view.forEach((i,p)=>{const m=msgs[i];if(m.t.toLowerCase().includes(l)||(m.f&&m.f.toLowerCase().includes(l)))qIdx.push(p)})}
  if(qs&&go){if(qIdx.length){qPos=0;jump(qIdx[0])}}
  $('#q').placeholder=qs?qIdx.length+' resultats':'Cerca (Intro = següent)';
}
function step(d){
  if(!qIdx.length)return;
  qPos=(qPos+d+qIdx.length)%qIdx.length;jump(qIdx[qPos]);
  $('#q').placeholder=(qPos+1)+' / '+qIdx.length;
}
$('#q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if($('#q').value.trim()!==qs)doSearch();else step(e.shiftKey?-1:1);
});
$('#nx').onclick=()=>{if($('#q').value.trim()!==qs)doSearch();else step(1)};
$('#pv').onclick=()=>step(-1);
$('#dt').onchange=e=>{
  if(!e.target.value)return;
  const [y,m,d]=e.target.value.split('-').map(Number),t=new Date(y,m-1,d).getTime();
  let p=view.findIndex(i=>msgs[i].ts.getTime()>=t);if(p<0)p=view.length-1;
  showChat();jump(p);
};
$('#ft').onchange=()=>{setView();gal?buildGal():jump(view.length-1,true)};
function showChat(){gal=false;$('#gb').classList.remove('on');$('#list').style.display='';$('#gal').style.display='none'}
$('#gb').onclick=()=>{
  if(gal){showChat();return}
  gal=true;$('#gb').classList.add('on');$('#list').style.display='none';$('#gal').style.display='grid';buildGal();
};
let galN=0;
function buildGal(){
  const G=$('#gal');G.textContent='';galN=0;more();
}
function more(){
  const G=$('#gal');G.querySelector('#gm')?.remove();
  const items=[];view.forEach((i,p)=>{if(msgs[i].f)items.push(p)});
  const slice=items.slice(galN,galN+120);galN+=slice.length;
  for(const p of slice){
    const m=msgs[view[p]],g=document.createElement('div');g.className='g';
    if(m.k==='img'||m.k==='vid'){const ph=document.createElement('div');ph.className='gt';ph.dataset.f=m.f;ph.dataset.k=m.k;ph.textContent='…';g.append(ph);io.observe(ph)}
    else g.textContent=(m.k==='aud'?'🎵 ':'📎 ')+m.f;
    g.title=m.ts.toLocaleString('ca');
    g.onclick=()=>{$('#ft').value='all';setView();showChat();const np=view.indexOf(view[p]);jump(np>=0?np:view.indexOf(msgs.indexOf(m)))};
    G.append(g);
  }
  if(galN<items.length){const b=document.createElement('button');b.id='gm';b.textContent='Mostra’n més';b.onclick=more;b.style.gridColumn='1/-1';G.append(b)}
  if(!items.length)G.textContent='Cap adjunt amb aquest filtre.';
}
$('#th').onclick=()=>{
  const r=document.documentElement,dark=matchMedia('(prefers-color-scheme:dark)').matches;
  const cur=r.dataset.theme||(dark?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';
};

$('#nw').onclick=()=>{
  urls.forEach(p=>p.then(u=>URL.revokeObjectURL(u)));urls=new Map();
  msgs=[];files=new Map();view=[];qs='';qIdx=[];
  $('#q').value='';$('#ft').value='all';$('#dt').value='';
  showChat();$('#list').textContent='';$('#gal').textContent='';
  $('#app').style.display='none';$('#drop').style.display='';
  $('#fz').value='';$('#fd').value='';lock('');
};
/* ---------- entrada ---------- */
$('#pick').onclick=()=>$('#fz').click();
$('#dirl').onclick=e=>{e.preventDefault();$('#fd').click()};
$('#fz').onchange=e=>e.target.files[0]&&fromZip(e.target.files[0]);
$('#fd').onchange=e=>fromDir(e.target.files);
const dz=$('#drop');
['dragover','dragenter'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)fromZip(f)});
</script>
</body>
</html>
